<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#F4F1EB}svg{display:block}</style></head><body>

const W = document.getElementById('w'), S2 = SOSED2();

const f1 = S2.front(W, {s: 0.5, lw: 3.2}); f1.set({x: 170, y: 640, face: {mouth: 'smile'}});
const a1 = S2.side(W, {s: 0.5, lw: 3.2}); a1.set({x: 470, y: 640, armN: {sh: -78, el: -6}, armF: {sh: -74, el: -8}, handN: 'flat', handF: 'flat', face: {mouth: 'smile'}});

  const f = S2.front(g, {s: 0.95, lw: 3.4}); f.set({x: 111 + i * 214, y: 1715, face: fc, legs: false}); mkT(111 + i * 214, 1060, n); });

  const a = S2.side(g, {s: 1.1, lw: 3.6}); a.set({x: 120 + i * 268, y: 2290, face: fc}); mkT(138 + i * 268, 1490, n); });

const w1 = S2.side(W, {s: 0.36, lw: 3}); w1.set({x: 150, y: 1900, legN: {foot: [210, 1888]}, legF: {foot: [95, 1888]}, armN: {sh: 18, el: -14}, armF: {sh: -20, el: -20}, face: {mouth: 'smile'}});
const w2 = S2.side(W, {s: 0.36, lw: 3}); w2.set({x: 400, y: 1900, legN: {foot: [395, 1888]}, legF: {foot: [430, 1840]}, armN: {sh: 0, el: -10}, armF: {sh: 0, el: -10}, face: {mouth: 'smile'}});

const g1 = S2.side(W, {s: 0.36, lw: 3}); g1.set({x: 700, y: 1900, lean: -6, armN: {to: [777, 1700]}, armF: {to: [777, 1660]}, handN: 'grip', handF: 'grip', face: {mouth: 'tongue', tongue: 0.6, eye: 'wide'}});

window.__errs = window.__poseErr;
</script></body></html>
