<svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">

      <feComposite in="g" in2="d" operator="in" result="gi"/><feBlend in="d" in2="gi" mode="multiply"/>

  </defs>

</div>
<svg id="ui" width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0;pointer-events:none">

  <linearGradient id="bandT" x1="0" y1="0" x2="0" y2="1"><stop offset=".75" stop-color="#F4F2EB"/><stop offset="1" stop-color="#F4F2EB" stop-opacity="0"/></linearGradient></defs>
  <rect x="0" y="1340" width="1080" height="580" fill="url(#band)"/>
  <rect x="0" y="0" width="1080" height="300" fill="url(#bandT)"/>
  <g id="hdg" font-family="Georgia" font-size="36"></g>

  <g id="mk"></g>
  <g id="clock" style="display:none">
    <circle cx="540" cy="384" r="66" fill="#F4F2EB" stroke="#141413" stroke-width="7"/>
    <g stroke="#141413" stroke-width="5" stroke-linecap="round"><path d="M540 326 V336" transform="rotate(0 540 384)"/><path d="M540 326 V336" transform="rotate(30 540 384)"/><path d="M540 326 V336" transform="rotate(60 540 384)"/><path d="M540 326 V336" transform="rotate(90 540 384)"/><path d="M540 326 V336" transform="rotate(120 540 384)"/><path d="M540 326 V336" transform="rotate(150 540 384)"/><path d="M540 326 V336" transform="rotate(180 540 384)"/><path d="M540 326 V336" transform="rotate(210 540 384)"/><path d="M540 326 V336" transform="rotate(240 540 384)"/><path d="M540 326 V336" transform="rotate(270 540 384)"/><path d="M540 326 V336" transform="rotate(300 540 384)"/><path d="M540 326 V336" transform="rotate(330 540 384)"/></g>

  <g id="caps" font-family="Georgia" fill="#141413" text-anchor="middle" font-weight="700"></g>

<script>
const {cam, sfx, el, on, EASE, prog, clamp} = E;
const load = (u) => { const x = new XMLHttpRequest(); x.open('GET', u, false); x.send(); return JSON.parse(x.responseText); };
const TL = load('data/blackout_calm.timings.json'), WD = load('data/blackout_calm.words.json');
const T = Object.fromEntries(TL.map((s) => [s.id, s.start]));
const norm = (w) => w.toLowerCase().replace(/[.,:;!?—«»]/g, '').replace(/ё/g, 'е');
/** Время слова диктора в сцене (первое совпадение из вариантов); нет — начало сцены. */
const W = (scene, ...words) => { const c = words.map(norm), hit = (WD[scene] || []).find((w) => c.includes(norm(w[0]))); if (!hit) console.warn('нет слова', scene, words); return hit ? hit[1] : T[scene]; };
const END = TL[TL.length - 1].start + TL[TL.length - 1].dur, DUR = END + 0.8;
E.init({dur: DUR});
const B = BRUSH(E), K = INKCLAY(E, B), PH = PAPERHERO(E);
const INK = '#141413', CLAY = '#D97757', CLAY2 = '#B4553A', SKIN = '#EFC9A8', SKY = '#6A9BCC', SKY2 = '#4E7DB0', OLIVE = '#788C5D', SAND = '#E9C46A', NIGHT = '#33476E', PAPER = '#F4F2EB';
const WOOD = '#C9A27E', SLAB = '#E6E0D2', WHITE = '#FBFAF6', DARK = '#2B2F3A', STEEL = '#B9C0C6', CURT = '#C7A27C', GLASS = '#DDE8F0';
const R = (x, y, w, h, r = 0) => r ? `M${x + r} ${y}H${x + w - r}Q${x + w} ${y} ${x + w} ${y + r}V${y + h - r}Q${x + w} ${y + h} ${x + w - r} ${y + h}H${x + r}Q${x} ${y + h} ${x} ${y + h - r}V${y + r}Q${x} ${y} ${x + r} ${y}Z` : `M${x} ${y}H${x + w}V${y + h}H${x}Z`;
const O = (cx, cy, rx, ry = rx) => `M${cx - rx} ${cy}a${rx} ${ry} 0 1 0 ${2 * rx} 0a${rx} ${ry} 0 1 0 ${-2 * rx} 0`;
const {ink, clay, hatch, note} = K;
const lerp = (a, b, u) => a + (b - a) * u, F1 = (v) => v.toFixed(1);
const show = (n, v) => { n.style.display = v ? '' : 'none'; };

// ══ Экранный слой: шапка шага и подпись с маркером на сцену (как в «Ночи») ══
const ui = (id) => document.getElementById(id);
const UB = BRUSH({...E, lineLayer: ui('mk'), defs: ui('ui').querySelector('defs'), on: (f) => E.on(f)});
const HEAD = [[0, 'ЧТО ЕСЛИ…', 'свет отключат зимой'], [T.s03, 'ШАГ 1 ИЗ 5', 'вода'], [T.s04, 'ШАГ 2 ИЗ 5', 'розетки'], [T.s05, 'ШАГ 3 ИЗ 5', 'еда'], [T.s06, 'ШАГ 4 ИЗ 5', 'плита'], [T.s07, 'ШАГ 5 ИЗ 5', 'тепло'], [T.s08, 'ЧТО ЕСЛИ…', 'свет дали']];
const heads = HEAD.map(([t0, a, b], i) => {
  const g = el('g', {}, ui('hdg'));
  el('text', {x: 90, y: 200, fill: OLIVE, 'letter-spacing': 7}, g).textContent = a;
  el('text', {x: 990, y: 200, 'text-anchor': 'end', 'font-style': 'italic', fill: INK}, g).textContent = b;
  return {g, t0, t1: (HEAD[i + 1] || [DUR + 1])[0]};
});
const CAPS = {s01: ['Что если отключат свет —', 'и не скажут, на сколько?'], s02: ['Час или пара суток —', 'пять спокойных шагов'], s03: ['Сначала —', 'набери воды'],
  s04: ['Технику — из розеток,', 'одну лампу оставь'], s05: ['Ешь сначала', 'из холодильника'], s06: ['Плитой не греться:', 'угарный газ не видно'],
  s07: ['Тепло —', 'в одной комнате'], s08: ['Скорее всего, свет дадут', 'раньше. Тем лучше'], s09: ['Сохрани —', 'и пусть не пригодится']};
const caps = TL.map((s) => {
  const [a, b] = CAPS[s.id], g = el('g', {}, ui('caps'));
  const c1 = el('text', {x: 540, y: 1448, 'font-size': Math.min(40, Math.round(800 / (a.length * 0.58)))}, g); c1.textContent = a;
  const big = Math.min(50, Math.round(800 / (b.length * 0.6)));
  const c2 = el('text', {x: 540, y: 1548, 'font-size': big, 'font-style': 'italic'}, g); c2.textContent = b;
  const t0 = s.start, t1 = s.start + s.dur, w = Math.min(900, b.length * big * 0.58 + 60);
  UB.stroke(`M${540 - w / 2} 1530 C${540 - w / 4} 1526 ${540 + w / 4} 1529 ${540 + w / 2} 1522`, t0 + 0.25, t0 + 0.55, {w: 34, color: 'rgba(217,119,87,0.62)', taper: [0.03, 0.06], until: t1 - 0.02, fade: (t) => 1 - EASE.io2(prog(t, t1 - 0.18, t1))});
  return {g, c1, c2, t0, t1};
});
on((t) => {
  heads.forEach((h) => { const a = EASE.o(prog(t, h.t0, h.t0 + 0.3)) * (1 - EASE.io2(prog(t, h.t1 - 0.2, h.t1))); h.g.style.opacity = a; show(h.g, a > 0.001); });
  const hl = ui('hl'), L = hl.__L || (hl.__L = hl.getTotalLength()); hl.style.strokeDasharray = L; hl.style.strokeDashoffset = L * (1 - EASE.io2(prog(t, 0.05, 0.6)));
  caps.forEach((c) => {
    const vis = t >= c.t0 && t <= c.t1; show(c.g, vis); if (!vis) return;
    const out = 1 - EASE.io2(prog(t, c.t1 - 0.18, c.t1));
    const q1 = EASE.o(prog(t, c.t0, c.t0 + 0.3)); c.c1.style.opacity = q1 * out; c.c1.setAttribute('transform', `translate(0 ${((1 - q1) * 26).toFixed(1)})`);
    const q2 = clamp(prog(t, c.t0 + 0.42, c.t0 + 0.75)), k2 = EASE.back(q2); c.c2.style.opacity = Math.min(1, q2 * 3) * out;
    c.c2.setAttribute('transform', `translate(540 1534) scale(${(1.3 - 0.3 * k2).toFixed(3)}) translate(-540 -1565)`);
  });
});

// ══ Опорные моменты — слова диктора ══
const t2 = T.s02, t3 = T.s03, t4 = T.s04, t5 = T.s05, t6 = T.s06, t7 = T.s07, t8 = T.s08, t9 = T.s09;
const wSv1 = W('s01', 'свет,', 'свет');
const wChas = W('s02', 'час,', 'час'), wPar = W('s02', 'пару'), w5 = W('s02', '5', 'пять'), wVar = W('s02', 'вариант.', 'вариант');
const wNab = W('s03', 'Набери'), wBut = W('s03', 'бутылки'), wNas = W('s03', 'Насосы'), wNap = W('s03', 'напор');
const wVyd = W('s04', 'Выдерни'), wRoz = W('s04', 'розеток'), wSka = W('s04', 'качком', 'скачком'), wOdn = W('s04', 'Одну'), wOst = W('s04', 'оставь'), wDal = W('s04', 'дали');
const wHol = W('s05', 'холодильнике'), wChe = W('s05', 'четыре'), wOtk = W('s05', 'открывать'), wMor = W('s05', 'Морозилка'), wKon = W('s05', 'Консервы');
const wPro = W('s06', 'прохладнее'), wGaz = W('s06', 'Газовую'), wNe = W('s06', 'включай'), wUg = W('s06', 'газ'), wSon = W('s06', 'сне');
const wZak = W('s07', 'Закрой'), wShch = W('s07', 'щель'), wZat = W('s07', 'заткни'), wOkno = W('s07', 'окно'), wSvi = W('s07', 'святера', 'свитера'), wOde = W('s07', 'одеяло', 'одеяла'), wChai = W('s07', 'горячий');
const wSvet = W('s08', 'свет'), wLuch = W('s08', 'лучше');
const POWER2 = wSvet + 0.05;

// ══ Сборка вещей: туша контуром, глина — чуть со сдвигом (≤ 4 px), по одной детали ══
const fades = [];
/** Крупная заливка без «пружины» — просто проявляется (стены, перекрытия). */
function fillIn(sc, d, t0, color, o = {}) { const p = el('path', {d, fill: color, opacity: 0}, o.parent || sc.clay); fades.push({p, t0, dur: o.dur || 0.35}); return p; }
on((t) => fades.forEach((f) => { const a = EASE.o(prog(t, f.t0, f.t0 + f.dur)); f.p.style.opacity = a; show(f.p, a > 0.001); }));
/** Предмет из деталей [d, цвет|null, толщина туши]; детали рисуются по очереди. */
function thing(sc, t0, parts, o = {}) {
  let t = t0;
  for (const [d, color, w = 5, dur = 0.22] of parts) { if (color) { const s = clay(sc, d, t + 0.06, color, o.dx ?? 4, o.dy ?? 3); if (o.evenodd) s.p.setAttribute('fill-rule', 'evenodd'); } if (w) ink(sc, d, t, dur, w, o.color ? {color: o.color} : {}); t += o.step ?? 0.07; }
  return t;
}
/** Динамический элемент, проявляется к t0. */
const appear = (n, t0, d = 0.3) => on((t) => { const a = EASE.o(prog(t, t0, t0 + d)); n.style.opacity = a; show(n, a > 0.001); });

// ══ A. Дом гаснет (s01): окна гаснут волной на «свет», наше — последним ══
{
  const Y = -1500, sc = K.place(Y, 0, t2 + 1.2);
  clay(sc, R(110, 320, 860, 930, 18), -0.4, NIGHT, 0, 0);
  clay(sc, O(830, 430, 44), -0.35, PAPER, 0, 0);
  ink(sc, O(830, 430, 44), -0.3, 0.25, 4);
  note(sc, 160, 500, '−20°', 0.45, {size: 84, until: t2 + 0.3});
  const snow = el('g', {}, sc.top);
  for (let i = 0; i < 40; i++) el('circle', {cx: 130 + ((i * 113) % 820), cy: 340 + ((i * 71) % 900), r: 2.5 + (i % 3), fill: PAPER, opacity: 0.85}, snow);
  on((t) => [...snow.children].forEach((c, i) => c.setAttribute('transform', `translate(${(Math.sin(t + i) * 6).toFixed(1)} ${(((t * 45 + i * 13) % 90) - 45).toFixed(1)})`)));
  ink(sc, 'M300 1250 V440 H780 V1250', 0.0, 0.6, 8);
  ink(sc, 'M280 440 H800 M470 1250 V1170 H610 V1250 M450 1170 H630', 0.4, 0.3, 5);
  for (let r = 0; r < 9; r++) for (let c = 0; c < 5; c++) {
    const x = 330 + c * 92, y = 470 + r * 78, d = R(x, y, 56, 50, 4), me = r === 6 && c === 2;
    const off = me ? wSv1 + 1.3 : wSv1 + 0.05 + r * 0.085 + c * 0.02;
    clay(sc, d, 0.1 + (r * 5 + c) * 0.006, SAND, 0, 0, {out: off});
    ink(sc, d, 0.15 + (r * 5 + c) * 0.006, 0.18, 3);
    if (me) hatch(sc, d, off + 0.05, off + 0.35, {angle: -40, gap: 8, w: 2.2});
  }
  sfx(wSv1 + 1.3, 'file:foley/switch_click.wav', {gain: 1});
  ink(sc, 'M80 1250 H1000', 0.3, 0.4, 4);
  hatch(sc, 'M80 1252 H1000 V1300 H80 Z', 0.5, 0.9, {angle: -40, gap: 10, w: 2});
  ink(sc, 'M110 1250 C170 1222 240 1226 300 1250 M780 1250 C840 1220 920 1226 980 1250', 0.6, 0.3, 4);
  // выноска: от нашего окна вниз — в разрез квартиры
  ink(sc, O(542, 963, 46), wSv1 + 1.6, 0.3, 5, {color: CLAY});
  ink(sc, 'M548 1010 C 600 1420 1480 1330 1610 1786', 2.95, 0.95, 6, {ease: 'io2'});
  cam(0, 540, Y + 860, 1.0);
  cam(2.85, 540, Y + 880, 1.06);
  cam(3.95, 1620, 880, 1.0, {ease: 'io'});
}

// ══ Квартира в разрезе: ванная 0–1080, комната 1080–2160, кухня 2160–3240 ══
const FL = 1250, CE = 340;
const flat = K.place(0, t2 - 1.0, DUR + 1);
const backL = el('g', {}, flat.clay);   // вода, свет лампы — под заливками вещей
const dynL = el('g', {}, flat.top), heroL = el('g', {}, flat.top), itemL = el('g', {}, flat.top), noteL = el('g', {}, flat.top);
const you = PH.person(heroL, {h: 560, top: CLAY, top2: CLAY2, sweater: OLIVE, seed: 1});
const LEGR = 560 * 0.04 + 5, SEAT = Math.round(FL + you.probe('sit', 1).hip[1] + LEGR); // сиденье — ровно под бёдрами позы sit
{
  const t0 = t2 - 0.3;
  fillIn(flat, R(-80, FL, 3400, 56), t0, SLAB); fillIn(flat, R(-80, CE - 56, 3400, 56), t0 + 0.05, SLAB);
  ink(flat, `M-80 ${FL} H3320`, t0, 0.8, 7); ink(flat, `M-80 ${FL + 56} H3320`, t0 + 0.15, 0.8, 4);
  ink(flat, `M-80 ${CE} H3320`, t0 + 0.05, 0.8, 6); ink(flat, `M-80 ${CE - 56} H3320`, t0 + 0.2, 0.8, 4);
  const wall = (x, t, door) => { const top = door ? 600 : FL; fillIn(flat, R(x - 15, CE, 30, top - CE), t, SLAB); ink(flat, `M${x - 15} ${CE} V${top} M${x + 15} ${CE} V${top}` + (door ? ` M${x - 15} ${top} H${x + 15}` : ''), t, 0.5, 5); };
  wall(0, t0 + 0.3); wall(1080, t0 + 0.4, true); wall(2160, t0 + 0.5, true); wall(3240, t0 + 0.6);
}

// ── Комната (1080–2160): тумба с телевизором, розетка, диван под окном, торшерный столик с лампой, дверь в кухню ──
const roomT = t2 + 0.2;
thing(flat, roomT, [[R(1100, 1100, 200, 150, 6), WOOD, 6], ['M1100 1175 H1300 M1200 1100 V1250', null, 4], ['M1140 1137 H1162 M1238 1137 H1260 M1140 1212 H1162 M1238 1212 H1260', null, 4],
  [R(1115, 925, 170, 118, 8), DARK, 6], ['M1135 952 L1160 938', null, 3], ['M1185 1043 L1178 1100 M1215 1043 L1222 1100', null, 5]]);
thing(flat, roomT + 0.45, [[R(1307, 1100, 36, 54, 6), WHITE, 4]]);
thing(flat, roomT + 0.6, [[R(1400, 948, 360, SEAT - 942, 18), SKY2, 6], [R(1418, SEAT - 4, 324, 42, 12), SKY, 5], [R(1388, SEAT + 36, 384, 66, 8), SKY2, 6],
  [R(1380, 1030, 54, SEAT + 102 - 1030, 18), SKY, 6], [R(1726, 1030, 54, SEAT + 102 - 1030, 18), SKY, 6], [`M1404 ${SEAT + 102} V1250 M1756 ${SEAT + 102} V1250`, null, 8]]);
