<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:PF;src:url(fonts/PlayfairDisplay-Bold.ttf)}
@font-face{font-family:CV;src:url(fonts/Caveat.ttf)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#F4F1EB}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
#stage>*{position:absolute;left:0;top:0}
.gr{width:1080px;height:1920px;mix-blend-mode:overlay;opacity:.16;pointer-events:none}
</style></head><body><div id="stage">
<svg id="sv" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <filter id="clayTex" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="2" seed="11" result="w"/>
      <feDisplacementMap in="SourceGraphic" in2="w" scale="4" result="d"/>
    </filter>
  </defs>

  <!-- 1. Фоновая бумага -->
  <rect width="1080" height="1920" fill="#F4F1EB"/>

  <!-- 2. Верхняя шапка -->
  <g font-family="Georgia" fill="#141413">
    <text x="90" y="152" font-size="78" font-weight="700">Что если</text>
    <text x="472" y="152" font-size="96" font-weight="700" fill="#C26A4A">?</text>
    <text x="134" y="202" font-size="28" letter-spacing="7" fill="#2B2836">ЗНАЙ, ЧТО ДЕЛАТЬ</text>
    <text x="990" y="202" font-size="44" font-style="italic" text-anchor="end" fill="#141413">15 минут</text>
    <path d="M90 232 H990" stroke="#141413" stroke-width="2.6" fill="none"/>
  </g>

  <!-- 3. Внутренняя рамка комнаты -->
  <!-- Координаты рамки: x=55..1024 (w=969), y=231..1431 (h=1200) -->
  <svg x="55" y="231" width="969" height="1200" viewBox="0 0 1080 1335" preserveAspectRatio="none">
    <defs id="roomDefs"></defs>
    <g id="roomWorld"></g>
  </svg>

  <!-- Контурная рамка вокруг комнаты (тушь, живая линия) -->
  <rect x="55" y="231" width="969" height="1200" fill="none" stroke="#211c1a" stroke-width="3.2"/>
  <rect x="52" y="228" width="975" height="1206" fill="none" stroke="#211c1a" stroke-width="1.2" opacity="0.4"/>

  <!-- 4. Нижняя подпись -->
  <g font-family="Georgia" fill="#141413" text-anchor="middle">
    <text x="540" y="1505" font-size="52" font-weight="700">Сохрани —</text>
    <!-- Маркер под второй строкой -->
    <path d="M205 1585 Q540 1572 875 1585" stroke="#D97757" stroke-width="36" stroke-linecap="round" fill="none" opacity="0.65" filter="url(#clayTex)"/>
    <text x="540" y="1582" font-size="74" font-weight="700" font-style="italic">и пусть не пригодится</text>
  </g>
</svg>
<div id="vig" style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 66% at 50% 47%, rgba(0,0,0,0) 65%, rgba(11,8,24,.35) 100%)"></div>
<img class="gr" src="tex/grain2_0.png">
</div>

<script src="lib/geom2.js"></script><script src="lib/look2.js"></script><script src="lib/yard2.js"></script><script src="lib/sosed2.js"></script><script src="lib/cat2.js"></script>
<script>
const {mk} = GEOM2, L2 = LOOK2, Y = YARD2, S2 = SOSED2();
const D = document.getElementById('roomDefs'), W = document.getElementById('roomWorld');

// Рисуем комнату
const rm = Y.room(W, D, {lw: 2.8});

// Заменяем вид из окна на снежные горы («Лавина»)
const wx = 70, wy = 330, ww = 330, wh = 560;
const wG = mk('g', {}, W);
// Горы со снегом поверх ночного окна
const mtn = mk('g', {}, wG);
Y.P(mtn, `M${wx} ${wy + wh} L${wx + 80} ${wy + 280} L${wx + 150} ${wy + 350} L${wx + 240} ${wy + 220} L${wx + ww} ${wy + wh} Z`, '#2C3048');
// Снежные шапки на вершинах
Y.P(mtn, `M${wx + 80} ${wy + 280} L${wx + 55} ${wy + 325} Q${wx + 80} ${wy + 315} ${wx + 105} ${wy + 325} Z`, '#EAEAF5');
Y.P(mtn, `M${wx + 240} ${wy + 220} L${wx + 210} ${wy + 270} Q${wx + 240} ${wy + 260} ${wx + 270} ${wy + 270} Z`, '#EAEAF5');
// Луна
mk('circle', {cx: wx + 200, cy: wy + 110, r: 24, fill: '#EAE6D6'}, wG);

// Ковёр на полу
const rug = mk('g', {}, W);
Y.P(rug, 'M150 1336L930 1336L1030 1776L50 1776Z', '#76565E', '#211c1a', 2.6);
Y.P(rug, 'M186 1362L894 1362L980 1748L100 1748Z', null, '#B48A84', 5, {opacity: 0.55});

// Канонический спящий кот на правом сиденье дивана
mk('image', {
  href: 'cat_rgba.png',
  x: 600,
  y: 1040,
  width: 250,
  height: 100
}, W);

// Герой сидит на левом сиденье дивана (на подушке, попа на y=1112, ноги на полу)
const hero = S2.side(W, {s: 0.52, lw: 3.2, off: 2});
hero.set({
  x: 370,
  y: 1360,
  legF: {hp: 85, kn: -90, toe: 0},
  legN: {hp: 82, kn: -88, toe: 0},
  armN: {sh: -35, el: -95},
  armF: {sh: -20, el: -60},
  handN: 'grip',
  handF: 'flat',
  face: {mouth: 'smile', look: [0.6, 0.2]}
});

// Кружка в руке
const mw = hero.wrist('N');
const mugG = mk('g', {transform: `translate(${mw[0] + 16} ${mw[1] + 20}) scale(0.48)`}, W);
mk('path', {d: 'M40 -70q42 0 42 34t-42 34', fill: 'none', stroke: '#211c1a', 'stroke-width': 13}, mugG);
mk('path', {d: 'M-46 -96H46V-8Q46 4 34 4H-34Q-46 4 -46 -8Z', fill: '#D06A33', stroke: '#211c1a', 'stroke-width': 6}, mugG);
mk('ellipse', {cx: 0, cy: -96, rx: 46, ry: 10, fill: '#6E3B22', stroke: '#211c1a', 'stroke-width': 5}, mugG);
// Пар от кружки
mk('path', {d: 'M-10 -115Q-18 -140 -5 -165T-10 -215 M15 -115Q25 -140 12 -165T15 -215', fill: 'none', stroke: '#F4EFE6', 'stroke-width': 6, 'stroke-linecap': 'round', opacity: 0.7}, mugG);

window.__seek = () => {}; window.__duration = 1;
window.__ready = (async () => { await document.fonts.ready; })();
</script></body></html>
