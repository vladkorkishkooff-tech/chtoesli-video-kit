<script>
const {cam, sfx, el, on, EASE, prog, clamp} = E;
const TL = (() => { const x = new XMLHttpRequest(); x.open('GET', 'data/blackout_calm.timings.json', false); x.send(); return JSON.parse(x.responseText); })();
const T = Object.fromEntries(TL.map((s) => [s.id, s.start]));
const WD = (() => { const x = new XMLHttpRequest(); x.open('GET', 'data/blackout_calm.words.json', false); x.send(); return JSON.parse(x.responseText); })();
const norm = (w) => w.toLowerCase().replace(/[.,:;!?—«»]/g, '').replace(/ё/g, 'е');
/** Время слова диктора в сцене (первое совпадение из вариантов); нет — начало сцены. */
const W = (scene, ...words) => { const c = words.map(norm), hit = (WD[scene] || []).find((w) => c.includes(norm(w[0]))); if (!hit) console.warn('нет слова', scene, words); return hit ? hit[1] : T[scene]; };
const END = TL[TL.length - 1].start + TL[TL.length - 1].dur, DUR = END + 0.8;
E.init({dur: DUR});
const B = BRUSH(E), K = INKCLAY(E, B);
const INK = '#141413', CLAY = '#D97757', CLAY2 = '#B4553A', SKIN = '#EFC9A8', SKY = '#6A9BCC', SKY2 = '#4E7DB0', OLIVE = '#788C5D', SAND = '#E9C46A', NIGHT = '#33476E', PAPER = '#F4F2EB';
const R = (x, y, w, h, r = 0) => r ? `M${x + r} ${y}H${x + w - r}Q${x + w} ${y} ${x + w} ${y + r}V${y + h - r}Q${x + w} ${y + h} ${x + w - r} ${y + h}H${x + r}Q${x} ${y + h} ${x} ${y + h - r}V${y + r}Q${x} ${y} ${x + r} ${y}Z` : `M${x} ${y}H${x + w}V${y + h}H${x}Z`;
const O = (cx, cy, rx, ry = rx) => `M${cx - rx} ${cy}a${rx} ${ry} 0 1 0 ${2 * rx} 0a${rx} ${ry} 0 1 0 ${-2 * rx} 0`;
const {ink, clay, hatch, note} = K;
const lerp = (a, b, u) => a + (b - a) * u;

// ══ Экранный слой: шапка правила и подпись с маркером на сцену ═════════
const ui = (id) => document.getElementById(id);
const UB = BRUSH({...E, lineLayer: ui('mk'), defs: ui('ui').querySelector('defs'), on: (f) => E.on(f)});
const HEAD = [[0, 'ЧТО ЕСЛИ…', 'свет отключат зимой'], [T.s03, 'ШАГ 1 ИЗ 5', 'вода'], [T.s04, 'ШАГ 2 ИЗ 5', 'розетки'], [T.s05, 'ШАГ 3 ИЗ 5', 'еда'], [T.s06, 'ШАГ 4 ИЗ 5', 'плита'], [T.s07, 'ШАГ 5 ИЗ 5', 'тепло'], [T.s08, 'ЧТО ЕСЛИ…', 'свет дали']];
const heads = HEAD.map(([t0, a, b], i) => {
  const g = el('g', {}, ui('hdg'));
  el('text', {x: 90, y: 200, fill: '#788C5D', 'letter-spacing': 7}, g).textContent = a;
  el('text', {x: 990, y: 200, 'text-anchor': 'end', 'font-style': 'italic', fill: INK}, g).textContent = b;
  return {g, t0, t1: (HEAD[i + 1] || [DUR + 1])[0]};
});
const CAPS = {s01: ['Что если отключат свет —', 'и не скажут, на сколько?'], s02: ['Час или пара суток —', 'пять спокойных шагов'], s03: ['Сначала —', 'набери воды'],
  s04: ['Технику — из розеток,', 'одну лампу оставь'], s05: ['Ешь сначала', 'из холодильника'], s06: ['Плитой не греться:', 'угарный газ не видно'],
  s07: ['Тепло —', 'в одной комнате'], s08: ['Скорее всего, свет дадут', 'раньше. Тем лучше'], s09: ['Сохрани —', 'и пусть не пригодится']};
const caps = TL.map((s) => {
  const [a, b] = CAPS[s.id], g = el('g', {}, ui('caps'));
  const c1 = el('text', {x: 540, y: 1448, 'font-size': Math.min(40, Math.round(800 / (a.length * 0.58)))}, g); c1.textContent = a;
  const big = Math.min(50, Math.round(800 / (b.length * 0.6)));
  const c2 = el('text', {x: 540, y: 1548, 'font-size': big, 'font-style': 'italic'}, g); c2.textContent = b;
  const t0 = s.start, t1 = s.start + s.dur;
  const w = Math.min(900, b.length * big * 0.58 + 60);
  UB.stroke(`M${540 - w / 2} 1530 C${540 - w / 4} 1526 ${540 + w / 4} 1529 ${540 + w / 2} 1522`, t0 + 0.25, t0 + 0.55, {w: 34, color: 'rgba(217,119,87,0.62)', taper: [0.03, 0.06], until: t1 - 0.02, fade: (t) => 1 - EASE.io2(prog(t, t1 - 0.18, t1))});
  return {g, c1, c2, t0, t1};
});
on((t) => {
  heads.forEach((h) => { const a = EASE.o(prog(t, h.t0, h.t0 + 0.3)) * (1 - EASE.io2(prog(t, h.t1 - 0.2, h.t1))); h.g.style.opacity = a; h.g.style.display = a > 0.001 ? '' : 'none'; });
  const hl = ui('hl'), L = hl.__L || (hl.__L = hl.getTotalLength()); hl.style.strokeDasharray = L; hl.style.strokeDashoffset = L * (1 - EASE.io2(prog(t, 0.05, 0.6)));
  caps.forEach((c) => {
    const vis = t >= c.t0 && t <= c.t1; c.g.style.display = vis ? '' : 'none'; if (!vis) return;
    const out = 1 - EASE.io2(prog(t, c.t1 - 0.18, c.t1));
    const q1 = EASE.o(prog(t, c.t0, c.t0 + 0.3)); c.c1.style.opacity = q1 * out; c.c1.setAttribute('transform', `translate(0 ${((1 - q1) * 26).toFixed(1)})`);
    const q2 = clamp(prog(t, c.t0 + 0.42, c.t0 + 0.75)), k2 = EASE.back(q2); c.c2.style.opacity = Math.min(1, q2 * 3) * out;
    c.c2.setAttribute('transform', `translate(540 1534) scale(${(1.3 - 0.3 * k2).toFixed(3)}) translate(-540 -1565)`);
  });
});


// ══ Мир: квартира в разрезе — кухня 0, гостиная 1080, спальня 2160, ванная 3240 ══
const F = FOLK(E);
const FL = 1250, CE = 330;
const t2 = T.s02, t3 = T.s03, t4 = T.s04, t5 = T.s05, t6 = T.s06, t7 = T.s07, t8 = T.s08, t9 = T.s09;
const flat = K.place(0, t2 - 0.6, DUR + 1);
const drawRoomShell = (x0, t0) => {
  ink(flat, `M${x0} ${CE} H${x0 + 1080}`, t0, 0.3, 5);
  ink(flat, `M${x0} ${FL} H${x0 + 1080}`, t0, 0.3, 5);
  hatch(flat, `M${x0} ${FL + 2} H${x0 + 1080} V${FL + 44} H${x0} Z`, t0 + 0.1, t0 + 0.4, {angle: -40, gap: 11, w: 2});
};
const wallAt = (x, t0) => { clay(flat, `M${x - 12} ${CE} H${x + 12} V760 H${x - 12} Z`, t0, '#D8CDB8', 0, 0, {quiet: true}); ink(flat, `M${x - 12} ${CE} V760 H${x + 12} V${CE}`, t0, 0.25, 4); };
// вступление: перо рисует всю квартиру слева направо, пока камера проходит по ней
const K0 = t2 - 0.4, L0 = t2 + 0.6, B0 = t2 + 1.6, W0 = t2 + 2.4;
// ── кухня
drawRoomShell(0, K0); wallAt(1080, K0 + 0.1);
clay(flat, R(110, 640, 230, 610, 26), K0, '#ECE3D1', 7, 6, {quiet: true}); ink(flat, R(110, 640, 230, 610, 26) + 'M110 820 H340', K0, 0.4, 6);
ink(flat, R(300, 700, 16, 90, 7) + R(300, 860, 16, 160, 7), K0 + 0.2, 0.2, 4);
[[150, 700, CLAY], [200, 740, OLIVE], [150, 770, SKY]].forEach(([x, y, c], i) => clay(flat, R(x, y, 30, 30, 7), K0 + 0.3 + i * 0.04, c, 3, 2, {quiet: true}));
clay(flat, R(470, 430, 300, 300, 6), K0 + 0.05, NIGHT, 0, 0, {quiet: true}); ink(flat, R(470, 430, 300, 300, 6) + 'M620 430 V730 M470 580 H770', K0 + 0.05, 0.35, 5);
ink(flat, 'M450 740 H790', K0 + 0.2, 0.2, 8);
ink(flat, 'M480 1000 H880 M500 1000 V1250 M860 1000 V1250', K0 + 0.1, 0.35, 6);
ink(flat, 'M412 1250 V890 M406 1122 H496 M488 1122 V1250', K0 + 0.15, 0.3, 6); // стул: спинка за спиной героя, сиденье на высоте его таза
clay(flat, R(860, 960, 200, 290, 10), K0 + 0.1, '#F2EEE6', 6, 5, {quiet: true});
ink(flat, R(860, 960, 200, 290, 10) + R(880, 1040, 160, 150, 10) + 'M868 1010 H1052', K0 + 0.1, 0.35, 5);
ink(flat, O(910, 958, 32, 7) + O(1010, 958, 32, 7), K0 + 0.25, 0.2, 4);
[890, 930, 970, 1010].forEach((x, i) => ink(flat, O(x, 985, 7), K0 + 0.3 + i * 0.03, 0.08, 3));
ink(flat, 'M820 600 H1060 M840 600 L850 614 M1040 600 L1030 614', K0 + 0.3, 0.2, 5); // полка с консервами
[[860, CLAY], [910, SAND], [960, OLIVE], [1010, CLAY]].forEach(([x, c], i) => { clay(flat, R(x - 18, 548, 36, 52, 6), K0 + 0.35 + i * 0.03, c, 3, 2, {quiet: true}); ink(flat, R(x - 18, 548, 36, 52, 6) + `M${x - 18} 560 H${x + 18} M${x - 18} 588 H${x + 18}`, K0 + 0.35 + i * 0.03, 0.12, 3); });
// ── гостиная
drawRoomShell(1080, L0); wallAt(2160, L0 + 0.1);
clay(flat, R(1250, 430, 260, 300, 6), L0, NIGHT, 0, 0, {quiet: true}); ink(flat, R(1250, 430, 260, 300, 6) + 'M1380 430 V730 M1250 580 H1510', L0, 0.35, 5);
clay(flat, 'M1130 1250 V1060 C1130 1030 1150 1020 1180 1020 H1480 C1510 1020 1530 1030 1530 1060 V1250 Z', L0 + 0.05, OLIVE, 7, 6, {quiet: true});
ink(flat, 'M1130 1250 V1060 C1130 1030 1150 1020 1180 1020 H1480 C1510 1020 1530 1030 1530 1060 V1250 M1130 1140 H1530 M1330 1140 V1250', L0 + 0.05, 0.4, 5);
ink(flat, R(1580, 1060, 280, 190, 8) + 'M1580 1150 H1860 M1720 1060 V1250', L0 + 0.1, 0.35, 5);
ink(flat, R(1600, 860, 240, 170, 10) + 'M1720 1030 V1060', L0 + 0.15, 0.3, 5); hatch(flat, R(1614, 874, 212, 142, 6), L0 + 0.25, L0 + 0.5, {angle: -30, gap: 10, w: 2});
clay(flat, R(1890, 1130, 70, 50, 10), L0 + 0.2, '#FBF6EA', 3, 2, {quiet: true}); ink(flat, R(1890, 1130, 70, 50, 10) + O(1912, 1155, 8) + O(1938, 1155, 8), L0 + 0.2, 0.25, 4);
ink(flat, 'M2290 1250 V720 M2250 1250 H2330', B0 + 0.2, 0.3, 5); // лампа — в спальне, где герой соберёт тепло: в финале она загорается рядом с ним
clay(flat, 'M2220 720 L2360 720 L2330 600 L2250 600 Z', B0 + 0.3, SAND, 3, 2, {quiet: true}); ink(flat, 'M2220 720 L2360 720 L2330 600 L2250 600 Z', B0 + 0.3, 0.25, 5);
ink(flat, 'M2290 1240 C2260 1252 2230 1250 2222 1230 C2218 1210 2220 1195 2220 1180', B0 + 0.3, 0.25, 4); clay(flat, R(2196, 1140, 48, 40, 9), B0 + 0.3, '#FBF6EA', 2, 2, {quiet: true}); ink(flat, R(2196, 1140, 48, 40, 9) + O(2220, 1160, 7), B0 + 0.3, 0.2, 4);
const lampSwitch = el('path', {d: 'M2266 1240 l14 -16', stroke: CLAY, 'stroke-width': 8, 'stroke-linecap': 'round'}, flat.top);
ink(flat, R(2246, 1228, 40, 24, 7), B0 + 0.4, 0.15, 3.5);
// ── спальня
drawRoomShell(2160, B0); wallAt(3240, B0 + 0.1);
clay(flat, R(2620, 420, 300, 320, 6), B0, NIGHT, 0, 0, {quiet: true}); ink(flat, R(2620, 420, 300, 320, 6) + 'M2770 420 V740 M2620 580 H2920', B0, 0.35, 5);
clay(flat, R(2380, 1070, 560, 180, 16), B0 + 0.1, '#E9DCC6', 6, 5, {quiet: true}); ink(flat, R(2380, 1070, 560, 180, 16) + 'M2380 1070 V960 C2380 940 2400 930 2420 930 H2440 V1070', B0 + 0.1, 0.4, 6);
ink(flat, R(2990, 1100, 150, 20, 6) + 'M3010 1120 V1250 M3120 1120 V1250', B0 + 0.2, 0.3, 4.5);
const doorLeaf = el('path', {d: 'M2160 760 V1250', stroke: INK, 'stroke-width': 7, 'stroke-linejoin': 'round', fill: '#C9A27E'}, flat.top);
// ── ванная
drawRoomShell(3240, W0);
for (let i = 0; i < 7; i++) ink(flat, `M3260 ${560 + i * 70} H4300`, W0 + 0.1 + i * 0.02, 0.15, 2, {color: '#14141360'});
for (let i = 0; i < 15; i++) ink(flat, `M${3260 + i * 70} 560 V1000`, W0 + 0.12 + i * 0.012, 0.12, 2, {color: '#14141360'});
clay(flat, 'M3420 1050 H4000 V1180 C4000 1230 3970 1250 3930 1250 H3490 C3450 1250 3420 1230 3420 1180 Z', W0 + 0.1, '#F4F0E8', 6, 5, {quiet: true});
ink(flat, 'M3400 1050 H4020 M3420 1050 V1180 C3420 1230 3450 1250 3490 1250 H3930 C3970 1250 4000 1230 4000 1180 V1050', W0 + 0.1, 0.4, 6);
ink(flat, 'M3900 760 V840 C3900 870 3880 880 3850 880 H3800 V910 M3870 800 H3930', W0 + 0.2, 0.3, 6);
const bottles = [4080, 4140, 4200].map((x, i) => { ink(flat, R(x, 1120, 44, 130, 12) + `M${x + 12} 1120 V1096 H${x + 32} V1120`, W0 + 0.3 + i * 0.05, 0.2, 3.5); return el('path', {fill: SKY, filter: 'url(#clayTex)', opacity: 0.85}, flat.clay); });

// ══ Темнота и свет ═════════════════════════════════════════════════════
const darkMask = el('mask', {id: 'darkMask', maskUnits: 'userSpaceOnUse', x: -200, y: 0, width: 4800, height: 1600}, E.defs);
el('rect', {x: -200, y: 0, width: 4800, height: 1600, fill: '#fff'}, darkMask);
const lg = el('radialGradient', {id: 'lightG'}, E.defs);
el('stop', {offset: 0, 'stop-color': '#000'}, lg); el('stop', {offset: 0.55, 'stop-color': '#444'}, lg); el('stop', {offset: 1, 'stop-color': '#fff'}, lg);
const warm = el('radialGradient', {id: 'warmG'}, E.defs);
el('stop', {offset: 0, 'stop-color': '#FFC772', 'stop-opacity': 0.55}, warm); el('stop', {offset: 1, 'stop-color': '#FFC772', 'stop-opacity': 0}, warm);
const dark = el('rect', {x: -200, y: CE, width: 4800, height: FL - CE + 60, fill: '#1A2440', mask: 'url(#darkMask)'}, E.topLayer);
const glowL = el('g', {}, E.topLayer);
const notesTop = el('g', {}, E.topLayer);
const lights = [];
const light = (x, y, r, onF, o = {}) => {
  const hole = el('ellipse', {cx: x, cy: y, rx: r, ry: r, fill: 'url(#lightG)'}, darkMask);
  const glow = o.glow ? el('ellipse', {cx: x, cy: y, rx: r * 0.7, ry: r * 0.7, fill: 'url(#warmG)'}, glowL) : null;
  lights.push({hole, glow, x, y, r, on: onF, o});
};
const POWER = W('s08', 'свет') + 0.05; // свет дали: лампа вспыхивает, темнота уходит

light(3060, 1040, 320, (t) => EASE.io2(prog(t, wOkno + 1.1, wOkno + 1.5)), {glow: true, flicker: true});
light(2290, 680, 420, (t) => EASE.back(clamp(prog(t, POWER2 - 0.1, POWER2 + 0.3))), {glow: true, keep: true});
sfx(POWER2, 'file:foley/fridge_hum.wav', {gain: 1}); // свет дали — оживает холодильник

// ══ Пометки вступления и шагов ════════════════════════════════════════
note(flat, 120, 470, 'на час?', W('s02', 'час,', 'час'), {size: 70, until: t3, parent: notesTop});
note(flat, 2650, 470, 'на пару суток?', W('s02', 'пару'), {size: 70, until: t3, parent: notesTop});
note(flat, 3520, 520, 'насосы — от сети', wNas, {size: 56, until: wNap, parent: notesTop});
note(flat, 1560, 640, 'скачок не страшен', wSka + 0.3, {size: 52, until: wOdn, parent: notesTop});
note(flat, 2190, 520, 'вкл. — ждём свет', wDal - 0.4, {size: 56, until: t5, parent: notesTop});
note(flat, 2200, 530, 'свет дали!', POWER2 + 0.3, {size: 84, parent: notesTop});

// ══ Часы — нить ролика; между шагами циферблат накрывает кадр и уносит в новую комнату ══
const CK = ui('clock'), IRIS = ui('iris');
const STEPS = [[t3, 1], [t4, 5], [t5, 60], [t6, 180], [t7, 360]];
const CLOCK_IN = W('s02', 'вариант.', 'вариант');
const minutesAt = (t) => { let m = 0; STEPS.forEach(([ts, v], i) => { const prev = i ? STEPS[i - 1][1] : 0; if (t >= ts - 0.3) m = lerp(prev, v, EASE.io2(prog(t, ts - 0.3, ts + 0.35))); }); return m; };
STEPS.forEach(([ts]) => { sfx(ts - 0.2, 'file:foley/clock_tick.wav', {gain: 1}); });
on((t) => {
  const show = EASE.o(prog(t, CLOCK_IN - 0.2, CLOCK_IN + 0.2)) * (1 - EASE.io2(prog(t, POWER2, POWER2 + 0.6)));
  let cover = 0;
  STEPS.forEach(([ts]) => { cover = Math.max(cover, EASE.io2(prog(t, ts - 0.4, ts - 0.05)) * (1 - EASE.io2(prog(t, ts + 0.12, ts + 0.5)))); });
  const cy = lerp(384, 900, cover), sc = lerp(1, 3.4, cover);
  CK.style.opacity = show; CK.style.display = show > 0.01 ? '' : 'none';
  CK.setAttribute('transform', `translate(540 ${cy}) scale(${sc.toFixed(3)}) translate(-540 -384)`);
  ui('ckT').style.opacity = 1 - Math.min(1, cover * 3); IRIS.setAttribute('cy', cy); IRIS.setAttribute('r', (66 + cover * 1300).toFixed(1)); IRIS.style.display = cover > 0.001 ? '' : 'none';
  const m = minutesAt(t);
  ui('ckM').setAttribute('transform', `rotate(${(m * 6).toFixed(1)} 540 384)`); ui('ckH').setAttribute('transform', `rotate(${(m * 0.5).toFixed(1)} 540 384)`);
  const mm = Math.round(m); ui('ckT').textContent = mm < 1 ? 'свет погас' : mm < 60 ? `прошло ${mm} мин` : `прошло ${Math.round(mm / 60)} ч`;
});

// ══ Анонс во вступлении: пять шагов значками на «пять спокойных шагов» ══
const icons = ui('icons'), iconT = W('s02', '5', 'пять');
[...icons.children].forEach((g, i) => {
  on((t) => { const q = EASE.back(clamp(prog(t, iconT + i * 0.18, iconT + i * 0.18 + 0.32))), out = EASE.io2(prog(t, CLOCK_IN - 0.3 + i * 0.04, CLOCK_IN + 0.1 + i * 0.04));
    const x = +g.dataset.x, y = 1190, tx = lerp(x, 540, out), ty = lerp(y, 384, out), s = q * (1 - out * 0.8);
    g.style.display = q > 0.001 && out < 0.999 ? '' : 'none'; g.setAttribute('transform', `translate(${tx.toFixed(1)} ${ty.toFixed(1)}) scale(${s.toFixed(3)})`); });
});

// ══ A. Дом гаснет (s01) ═══════════════════════════════════════════════
{
  const sc = K.place(-2800, 0, t2 + 0.05);
  clay(sc, R(110, 320, 860, 930, 18), 0, NIGHT, 0, 0, {quiet: true});
  clay(sc, O(830, 430, 44), 0.05, PAPER, 0, 0, {quiet: true});
  note(sc, 150, 470, '−20°', 0.4, {size: 96, color: PAPER, card: false, until: 2.6});
  const snow = el('g', {}, sc.top);
  for (let i = 0; i < 40; i++) el('circle', {cx: 130 + ((i * 113) % 820), cy: 340 + ((i * 71) % 900), r: 2.5 + (i % 3), fill: PAPER, opacity: 0.85}, snow);
  on((t) => [...snow.children].forEach((c, i) => c.setAttribute('transform', `translate(${Math.sin(t + i) * 6} ${((t * 45 + i * 13) % 90) - 45})`)));
  ink(sc, 'M300 1250 V440 H780 V1250', 0.0, 0.6, 8);
  ink(sc, 'M280 440 H800 M470 1250 V1170 H610 V1250 M450 1170 H630', 0.4, 0.3, 5);
  const off0 = W('s01', 'свет');
  for (let r = 0; r < 9; r++) for (let c = 0; c < 5; c++) {
    const x = 330 + c * 92, y = 470 + r * 78, d = R(x, y, 56, 50, 4), me = r === 6 && c === 2, off = me ? off0 + 1.3 : off0 - 0.1 + r * 0.1 + c * 0.02;
    clay(sc, d, 0.1 + (r * 5 + c) * 0.006, SAND, 0, 0, {quiet: true, out: off});
    ink(sc, d, 0.15 + (r * 5 + c) * 0.006, 0.18, 3);
  }
  ink(sc, 'M80 1250 H1000', 0.3, 0.4, 4);
  
  cam(0.0, 540, -2800 + 860, 1.0);
  cam(off0, 540, -2800 + 880, 1.06);
  cam(t2 - 0.05, 542, -2800 + 1000, 2.6, {ease: 'i'});
}

// ══ Монтаж: в каждом шаге общий → действие → крупно → назад; склейки на смене шага — под часами ══
const cut = (ts, x, y, s) => { cam(ts - 0.06, ...lastCam); cam(ts, x, y, s); lastCam = [x, y, s]; };
let lastCam = [2160, 860, 0.5];
cam(t2, 1500, 860, 0.55);
cam(W('s02', 'пару'), 2200, 860, 0.56);
cam(t3 - 0.06, 2300, 860, 0.58); lastCam = [2300, 860, 0.58];
// шаг 1 — вода
cut(t3, 3900, 900, 1.2);
cam(wNab + 0.3, 3860, 960, 1.35);
cam(wNas, 3880, 900, 1.15);
cam(t4 - 0.06, 3870, 940, 1.3); lastCam = [3870, 940, 1.3];
// шаг 2 — розетки и лампа
cut(t4, 1860, 940, 1.2);
cam(wVyd + 0.3, 1880, 1000, 1.38);
cam(wSka + 0.5, 1900, 960, 1.2);
cam(wOst, 2130, 900, 1.15);
cam(t5 - 0.06, 2140, 880, 1.2); lastCam = [2140, 880, 1.2];
// шаг 3 — еда
cut(t5, 460, 880, 1.15);
cam(wChe - 0.5, 360, 840, 1.3);
cam(wMor + 1.3, 580, 900, 1.25);
cam(wKon - 0.1, 760, 760, 1.3);
cam(t6 - 0.06, 760, 770, 1.3); lastCam = [760, 770, 1.3];
// шаг 4 — плита
cut(t6, 780, 860, 1.2);
cam(wNe, 820, 900, 1.35);
cam(wUg, 680, 800, 1.2);
cam(t7 - 0.06, 680, 810, 1.25); lastCam = [680, 810, 1.25];
// шаг 5 — тепло
cut(t7, 2300, 920, 1.2);
cam(wShch, 2300, 1000, 1.35);
cam(wOkno + 0.2, 2680, 760, 1.2);
cam(wChai - 0.3, 2560, 900, 1.38);
cam(t8 + 0.1, 2550, 900, 1.35);
cam(POWER2 - 0.35, 2400, 860, 1.05, {ease: 'io'});
cam(wLuch, 2410, 870, 0.95);
cam(t9, 2420, 860, 0.8);
cam(DUR, 2420, 860, 0.66);

E.cams.sort((a, b) => a.t - b.t);
// без фоновой музыки и нарастаний: тишина, голос и мягкие звуки действий
E.start();
</script>
