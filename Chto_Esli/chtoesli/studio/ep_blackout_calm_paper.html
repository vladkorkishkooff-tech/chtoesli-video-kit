  .map((n) => { const im = new Image(); im.src = TX(n); return im.decode().catch(() => console.warn('нет текстуры', n)); })).then(() => document.fonts.ready);

{ // значки шагов в шапке: текущий — крупнее, в терракотовом кольце; пройденные — с галочкой; будущие — бледные
  const ST = [T.s03, T.s04, T.s05, T.s06, T.s07, T.s08], G = el('g', {}, ui('hdg')), Y0 = 187, X = (i) => 600 + (i - 2) * 62;

  s07: ['Тепло —', 'в одной комнате'], s08: ['Скорее всего, свет дадут', 'раньше. Тем лучше'], s09: ['Сохрани —', 'и пусть не пригодится']};
